site_name: ThermoWeave
site_description: Thermodynamic models and phase-equilibrium calculations in Python
site_url: https://tum-btx.github.io/thermoweave-docs/
repo_url: https://github.com/TUM-BTX/thermoweave-docs
repo_name: GitHub
edit_uri: ''
docs_dir: docs
site_dir: site
copyright: ThermoWeave contributors · MIT license

theme:
  name: material
  font: false
  logo: assets/brand-mark.svg
  favicon: assets/brand-mark.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false
      include_source: true
      markdown_cell_processor: mkdocs
      ignore_h1_titles: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/thermoweave.css

extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

exclude_docs: |
  README.md

nav:
  - Home: index.md
  - Theory:
      - Theory overview: theory.md
      - Thermodynamic foundations: theory/foundations.md
      - Equations of state: theory/equations-of-state.md
      - SAFT-γ Mie: theory/saft-gamma-mie.md
      - Excess Gibbs energy models: theory/excess-gibbs.md
      - NRTL and SPT-NRTL: theory/nrtl.md
      - COSMO-RS and learned models: theory/cosmors-and-learned-models.md
      - Phase equilibria and SLLE: theory/phase-equilibria.md
      - Derivatives and consistency: theory/derivatives.md
  - Practical guide:
      - Practical overview: guide/index.md
      - Install and verify:
          - Installation: installation.md
          - Linux: installation/linux.md
          - Windows: installation/windows.md
          - macOS: installation/macos.md
          - Troubleshooting: installation/troubleshooting.md
      - Set up a model:
          - SAFT-γ Mie: models/saft-gamma-mie.md
          - NRTL: models/nrtl.md
          - SPT-NRTL collection: models/spt-nrtl.md
          - openCOSMO-RS: models/opencosmors.md
          - HANNA: models/hanna.md
      - Run calculations: guide/calculations.md
      - Fit parameters:
          - NRTL fitting: advanced/nrtl-fitting.md
          - COSMO-RS parametrization: advanced/parametrization.md
      - Corpus evaluation: advanced/production-evaluation.md
  - Tutorials:
      - Choose a calculation: tutorials.md
      - First calculations:
          - 00 · Quickstart and units: notebooks/00_quickstart_and_units.ipynb
          - 01 · Activities and excess Gibbs energy: notebooks/01_excess_gibbs_models.ipynb
          - 02 · Molecules and group assignment: notebooks/02_saft_molecules_and_groups.ipynb
          - 03 · EOS properties: notebooks/03_saft_eos_properties.ipynb
          - 04 · Derivatives and responses: notebooks/04_derivatives_and_response_functions.ipynb
      - Phase equilibria:
          - 05 · Vapour–liquid equilibrium: notebooks/05_vapour_liquid_equilibrium.ipynb
          - 06 · Liquid stability and flash: notebooks/06_liquid_stability_and_flash.ipynb
          - 07 · Solubility and solid–liquid flash: notebooks/07_solubility_and_solid_liquid_flash.ipynb
          - 10 · Binary SLLE with SAFT: notebooks/10_binary_slle_saft.ipynb
          - 11 · Ternary SLLE with SAFT: notebooks/11_ternary_slle_saft.ipynb
          - 12 · SLLE with COSMO-RS: notebooks/12_binary_ternary_slle_cosmors.ipynb
      - Models and fitting:
          - 08 · Parameter fitting: notebooks/08_parameter_fitting_and_evaluation.ipynb
          - 09 · COSMO-RS and HANNA: notebooks/09_cosmors_and_hanna.ipynb
          - 13 · NRTL and fitting: notebooks/13_nrtl_and_parameter_fitting.ipynb
          - 14 · SPT-NRTL collection: notebooks/14_spt_nrtl_parameters.ipynb
      - Analytic theory exercises:
          - Custom activity model: notebooks/theory/custom_activity_models.ipynb
          - Reactive and electrolyte illustration: notebooks/theory/synthetic_reactive_electrolytes.ipynb
  - Reference:
      - API and units: api.md
      - Capabilities and assumptions: capabilities.md
      - Scientific references: references.md
      - Third-party notices: third-party-notices.md
      - Documentation maintenance: contributing-docs.md
